<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Owner Access | Temsalet FC</title>
	<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		body { background: #090d16; color: #f9fafb; font-family: 'Plus Jakarta Sans', sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
		.login-card { background: #111827; padding: 40px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); width: min(92%, 380px); text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
		h2 { font-family: 'Oswald', sans-serif; font-size: 2rem; color: #10b981; margin-bottom: 8px; text-transform: uppercase; }
		p { color: #9ca3af; font-size: 0.88rem; margin-bottom: 24px; }
		input { width: 100%; padding: 12px 14px; margin-bottom: 14px; background: #090d16; border: 1px solid #374151; color: #fff; border-radius: 8px; font-size: 0.95rem; }
		input:focus { outline: none; border-color: #10b981; }
		button { width: 100%; padding: 12px; background: #10b981; color: #090d16; font-weight: 700; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
		button:hover { background: #059669; }
		.error { background: rgba(239, 68, 68, 0.15); color: #f87171; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
		a { display: inline-block; margin-top: 20px; color: #9ca3af; text-decoration: none; font-size: 0.85rem; }
		a:hover { color: #fff; }
	</style>
</head>
<body>
	<div class="login-card">
		{% if is_setup %}
			<h2>Create Owner Login</h2>
			<p>Set your permanent username and password. You will use this every time you manage the club.</p>
		{% else %}
			<h2>Owner Sign In</h2>
			<p>Enter your credentials to unlock the management dashboard.</p>
		{% endif %}

		{% if error %}
			<div class="error">{{ error }}</div>
		{% endif %}

		<form action="/login" method="POST">
			<input type="text" name="username" placeholder="Username" required autofocus>
			<input type="password" name="password" placeholder="Password" required>
			<button type="submit">{% if is_setup %}Save &amp; Enter Dashboard{% else %}Log In{% endif %}</button>
		</form>

		<a href="/">← Back to Club Website</a>
	</div>
</body>
</html>
